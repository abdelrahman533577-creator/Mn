const startDate = new Date(2026, 9, 16);

function dayNumber(d) {
  return Math.floor(
    Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) /
    86400000
  );
}

function getDailyIndex() {
  const today = new Date();
  const elapsed = Math.max(
    0, dayNumber(today) - dayNumber(startDate)
  );
  return elapsed % messages.length;
}

function getDateKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function render() {
  const current = getDailyIndex();

  document.getElementById("message").textContent =
    messages[current];

  document.getElementById("date").textContent =
    "رسالة النهارده رقم " + (current + 1) +
    " من " + messages.length + " 💗\n" +
    new Date().toLocaleDateString("ar-EG", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
}

  const dateKey = getDateKey();

  try {
    const herDoc = await getDoc(
      doc(db, "message_reads", `${dateKey}_her`)
    );

      doc(db, "message_reads", `${dateKey}_me`)
    );

    status.textContent =
      "حالة قراءة رسالة النهارده 💌\n" +
      "وزتي: " +
      (herDoc.exists() && herDoc.data().read
        ? "❤️ قريتها"
        : "لسه مسجلتش القراءة") +
      "\nعبدالرحمن: " +
      (myDoc.exists() && myDoc.data().read
        ? "💙 قرأها"
        : "لسه مسجلش القراءة");
  } catch (error) {
    console.error(error);
    status.textContent =
      "مش قادر أجيب حالة القراءة دلوقتي. جرّب تحدّث الصفحة.";
  }
}

async function markAsRead(person, buttonId) {
  const button = document.getElementById(buttonId);
  const originalText = button.textContent;

  button.disabled = true;
  button.textContent = "جاري التسجيل... ❤️";

  try {
    const current = getDailyIndex();
    const dateKey = getDateKey();

    await setDoc(
      doc(db, "message_reads", `${dateKey}_${person}`),
      {
        person,
        messageNumber: current + 1,
        read: true,
        dateKey,
        updatedAt: serverTimestamp()
      }
    );

    button.textContent = "اتسجلت القراءة ❤️";
    button.classList.add("pop");
    await refreshReadStatus();
  } catch (error) {
    console.error(error);
    button.textContent = originalText;
    alert(
      "التسجيل ما تمش. اتأكد من Firebase Rules وAuthentication واتصال الإنترنت."
    );
  } finally {
    button.disabled = false;
  }
}

document.getElementById("herRead").addEventListener(
  "click", () => markAsRead("her", "herRead")
);

document.getElementById("myRead").addEventListener(
  "click", () => markAsRead("me", "myRead")
);

async function startApp() {
  render();

  try {
    await signInAnonymously(auth);
    await refreshReadStatus();
  } catch (error) {
    console.error(error);
    document.getElementById("readStatus").textContent =
      "تعذر الاتصال بقاعدة البيانات. راجع إعدادات Firebase.";
  }
}

startApp();

function scheduleMidnightUpdate() {
  const now = new Date();
  const tomorrow = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1,
    0, 0, 1
  );

  setTimeout(() => {
    render();
    refreshReadStatus();
    scheduleMidnightUpdate();
  }, tomorrow - now);
}

scheduleMidnightUpdate();
</script>
